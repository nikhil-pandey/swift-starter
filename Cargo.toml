[workspace]
resolver = "3"
members = ["crates/*", "tools/uniffi"]

[workspace.package]
license = "MIT"

[workspace.dependencies]
open-meteo = { path = "crates/open-meteo" }
reqwest = { version = "0.13", features = ["json", "query"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros"] }
tracing = "0.1"
tracing-oslog = "0.3"
tracing-subscriber = "0.3"
uniffi = { version = "=0.32.2", default-features = false, features = ["tokio"] } # keep in sync with uniffi_bindgen in tools/uniffi
weather = { path = "crates/weather" }
